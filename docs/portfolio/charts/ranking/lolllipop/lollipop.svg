<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="lollipop chart icon">
  <!-- Estilo -->
  <defs>
    <style>
      .axis { stroke:#153268; stroke-width:2; stroke-linecap:round; fill:none; }
      .stem { stroke:#153268; stroke-width:2; stroke-linecap:round; fill:none; }
      .dot  { fill:#153268; }
    </style>
  </defs>

  <!-- Ejes (Y vertical, X horizontal) -->
  <path class="axis" d="M8 8v48M8 56h48"></path>

  <!-- Lollipops horizontales (categorías en Y, valor en X) -->
  <!-- Cat A -->
  <line class="stem" x1="8" y1="16" x2="30" y2="16"></line>
  <circle class="dot" cx="30" cy="16" r="3.5"></circle>
  <!-- Cat B -->
  <line class="stem" x1="8" y1="26" x2="44" y2="26"></line>
  <circle class="dot" cx="44" cy="26" r="3.5"></circle>
  <!-- Cat C -->
  <line class="stem" x1="8" y1="36" x2="24" y2="36"></line>
  <circle class="dot" cx="24" cy="36" r="3.5"></circle>
  <!-- Cat D -->
  <line class="stem" x1="8" y1="46" x2="52" y2="46"></line>
  <circle class="dot" cx="52" cy="46" r="3.5"></circle>
  <!-- Cat E -->
  <line class="stem" x1="8" y1="20" x2="38" y2="20" opacity="0.6"></line>
  <circle class="dot" cx="38" cy="20" r="3.5" opacity="0.6"></circle>
</svg>
