<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" aria-label="dot-plot icon with axes">
  <defs>
    <style>
      .axis { stroke:#153268; stroke-width:2; fill:none; }
      .conn { stroke:#153268; stroke-width:2; stroke-linecap:round; fill:none; }
      .dot  { fill:#153268; }
    </style>
  </defs>
  
  <!-- Ejes -->
  <line class="axis" x1="10" y1="60" x2="65" y2="60"></line> <!-- eje X -->
  <line class="axis" x1="10" y1="10" x2="10" y2="60"></line> <!-- eje Y -->

  <!-- Row 1 -->
  <line class="conn" x1="20" y1="20" x2="50" y2="20"></line>
  <circle class="dot" cx="20" cy="20" r="3"></circle>
  <circle class="dot" cx="50" cy="20" r="3"></circle>

  <!-- Row 2 -->
  <line class="conn" x1="25" y1="35" x2="45" y2="35"></line>
  <circle class="dot" cx="25" cy="35" r="3"></circle>
  <circle class="dot" cx="45" cy="35" r="3"></circle>

  <!-- Row 3 -->
  <line class="conn" x1="18" y1="50" x2="55" y2="50"></line>
  <circle class="dot" cx="18" cy="50" r="3"></circle>
  <circle class="dot" cx="55" cy="50" r="3"></circle>
</svg>
